<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbería El Corte · Asistente Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E0E10;
    --surface: #17171A;
    --surface-2: #202024;
    --accent: #C4A25A;
    --accent-strong: #9C7F3E;
    --accent-tint: #2A2318;
    --text: #EFEDE8;
    --text-muted: #8C8A86;
    --border: #333336;
    --danger: #C4574A;
    --online: #6FBF7A;
    --stripe-red: #A63C3C;
    --stripe-blue: #3C5FA6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 16px 60px;
  }
  .app{
    width:100%;
    max-width: 760px;
  }
  .title-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 18px;
  }
  .title-row .icon{
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent-tint);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 16px;
  }
  .title-row h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 21px;
    margin: 0;
    color: var(--accent);
  }
  .title-row .subtitle{
    font-size: 12px;
    color: var(--text-muted);
    margin-left: 4px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow:hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  .chat-header{
    background: linear-gradient(120deg, #000000, #1C1710);
    color: var(--accent);
    padding: 14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom: 2px solid var(--accent-strong);
  }
  .chat-header .who{
    display:flex;
    align-items:center;
    gap:10px;
    font-size: 14px;
    font-weight:600;
  }
  .chat-header .avatar{
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(196,162,90,0.16);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 15px;
  }
  .status-pill{
    display:flex;
    align-items:center;
    gap:6px;
    font-size: 11px;
    background: rgba(196,162,90,0.14);
    padding: 4px 10px;
    border-radius: 100px;
    color: var(--text);
  }
  .status-pill .dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--online);
  }

  .barber-stripe{
    height: 4px;
    background: repeating-linear-gradient(
      -45deg,
      var(--stripe-red) 0 10px,
      #F2EFE6 10px 20px,
      var(--stripe-blue) 20px 30px
    );
  }

  .chat-log{
    padding: 18px;
    display:flex;
    flex-direction:column;
    gap: 12px;
    max-height: 460px;
    overflow-y:auto;
    background: var(--surface);
  }
  .msg{
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .msg strong{ color: var(--accent); }
  .msg.bot{
    align-self:flex-start;
    background: var(--accent-tint);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.user{
    align-self:flex-end;
    background: var(--accent);
    color: #14110A;
    font-weight:600;
    border-bottom-right-radius: 4px;
  }
  .msg.blocked{
    align-self:flex-start;
    background: var(--surface-2);
    border: 1px dashed var(--danger);
    color: var(--danger);
    font-size: 13px;
  }
  .msg.typing{
    align-self:flex-start;
    color: var(--text-muted);
    font-style: italic;
    font-size: 13px;
  }

  form.composer{
    display:flex;
    gap:8px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  form.composer input[type=text]{
    flex:1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-family:'Work Sans', sans-serif;
    font-size: 14px;
  }
  form.composer input[type=text]:focus{ outline:1px solid var(--accent); }
  form.composer button{
    background: var(--accent);
    color: #14110A;
    border:none;
    border-radius: 10px;
    padding: 0 20px;
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size: 14px;
    cursor:pointer;
    transition: transform .12s ease, opacity .12s ease;
  }
  form.composer button:hover{ transform: translateY(-1px); }
  form.composer button:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 10px; }

  @media (prefers-reduced-motion: reduce){
    form.composer button{ transition:none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="title-row">
    <div class="icon">💈</div>
    <h1>Barbería El Corte</h1>
    <span class="subtitle">Sistema de turnos y asistente virtual</span>
  </div>

  <div class="card">
    <div class="chat-header">
      <div class="who">
        <div class="avatar">💬</div>
        <span>Asistente Virtual · Barbería El Corte</span>
      </div>
      <div class="status-pill"><span class="dot"></span>En línea</div>
    </div>
    <div class="barber-stripe"></div>

    <div class="chat-log" id="chatLog"></div>

    <form class="composer" id="composerForm">
      <input type="text" id="userInput" placeholder="Ej: ¿Tienen turno para un fade hoy?" autocomplete="off">
      <button type="submit" id="sendBtn">Enviar</button>
    </form>
  </div>
</div>

<script>
  const BOT_NAME = "Barbería El Corte";

  const chatLog = document.getElementById('chatLog');
  const form = document.getElementById('composerForm');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // Historial que se manda al backend (el system prompt lo agrega el servidor)
  const conversation = [];

  function renderMarkdownLite(text){
    const escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    return escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  function addMessage(text, cls){
    const div = document.createElement('div');
    div.className = `msg ${cls}`;
    if(cls === "bot" || cls === "blocked"){
      div.innerHTML = renderMarkdownLite(text);
    }else{
      div.textContent = text;
    }
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
    return div;
  }

  addMessage(`¡Hola! Soy el asistente de ${BOT_NAME}. Preguntame sobre turnos, horarios, cortes, fade, barba o precios.`, "bot");

  async function callBackend(){
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversation })
    });

    if(!res.ok){
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || `El servidor respondió ${res.status}`);
    }

    return res.json(); // { blocked, reply }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;

    addMessage(text, "user");
    input.value = "";
    sendBtn.disabled = true;

    conversation.push({ role: "user", content: text });
    const typingEl = addMessage("Escribiendo...", "typing");

    try{
      const { blocked, reply } = await callBackend();
      typingEl.remove();

      if(blocked){
        addMessage(reply, "blocked");
        conversation.pop(); // no cuenta como parte de la charla con el modelo
      }else{
        addMessage(reply, "bot");
        conversation.push({ role: "assistant", content: reply });
      }
    }catch(err){
      typingEl.remove();
      addMessage("Ocurrió un error al conectar con el servidor: " + err.message, "blocked");
      conversation.pop();
    }finally{
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
